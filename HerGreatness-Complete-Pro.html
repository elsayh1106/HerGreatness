                    question.toLowerCase().includes(item.q.toLowerCase().split(' ').slice(0, 3).join(' '))
                );
                
                if (found) {
                    setAnswer({
                        question: found.q,
                        answer: found.a[tone]
                    });
                } else {
                    setAnswer({
                        question: question,
                        answer: tone === 'teenFriendly' ? 'That\'s a great question! For specific medical advice, please consult your healthcare provider.' : tone === 'firstTime' ? 'This is an important question. Please discuss this with your healthcare provider for personalized guidance.' : 'For detailed medical information on this topic, please consult with your healthcare provider or review medical literature.'
                    });
                }
            };

            return (
                <div className="space-y-6">
                    {/* Medical Disclaimer */}
                    <div className="bg-red-50 border-l-4 border-red-600 p-6 rounded">
                        <p className="font-bold text-red-800 mb-3">{t.ai.disclaimer}</p>
                        <ul className="text-sm text-red-700 space-y-1 ml-4 list-disc">
                            <li>Medical advice, diagnosis, or treatment</li>
                            <li>Unusual symptoms or concerns</li>
                            <li>Changes in your pregnancy</li>
                            <li>Emergency situations (call 911)</li>

                    {/* Tone Selector */}
                    <div className="bg-white rounded-lg p-6 border border-gray-200 shadow-sm">
                        <label className="block text-sm font-semibold text-gray-700 mb-3">{t.ai.responseTone}</label>
                        <div className="grid grid-cols-3 gap-3">
                            <button
                                onClick={() => setTone('teenFriendly')}
                                className={`p-3 rounded-lg transition ${tone === 'teenFriendly' ? 'bg-pink-500 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}
                            >
                                {t.ai.teenFriendly}
                            </button>
                            <button
                                onClick={() => setTone('firstTime')}
                                className={`p-3 rounded-lg transition ${tone === 'firstTime' ? 'bg-pink-500 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}
                            >
                                {t.ai.firstTime}
                            </button>
                            <button
                                onClick={() => setTone('medicalDetailed')}
                                className={`p-3 rounded-lg transition ${tone === 'medicalDetailed' ? 'bg-pink-500 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}
                            >
                                {t.ai.medicalDetailed}
                            </button>
                        </div>
                    </div>

                    {/* Question Input */}
                    <div className="bg-white rounded-lg p-6 border border-gray-200 shadow-sm">
                        <div className="flex gap-2">
                            <input
                                type="text"
                                placeholder={t.ai.askQuestion}
                                value={question}
                                onChange={(e) => setQuestion(e.target.value)}
                                onKeyPress={(e) => e.key === 'Enter' && getAnswer()}
                                className="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-pink-500"
                            />
                            <button
                                onClick={getAnswer}
                                className="bg-pink-500 text-white px-6 py-3 rounded-lg font-semibold hover:bg-pink-600 transition"
                            >
                                {t.ai.getAnswer}
                            </button>
                        </div>
                    </div>

                    {/* Answer Display */}
                    {answer && (
                        <div className="bg-gradient-to-br from-pink-50 to-purple-50 rounded-lg p-6 border border-pink-200 shadow-md fade-in">
                            <p className="font-semibold text-gray-800 mb-3">Q: {answer.question}</p>
                            <p className="text-gray-700 leading-relaxed">{answer.answer}</p>
                        </div>
                    )}

                    {/* Common Questions */}
                    <div className="bg-white rounded-lg p-6 border border-gray-200 shadow-sm">
                        <h3 className="font-semibold text-gray-800 mb-4">{t.ai.commonQuestions}</h3>

                                >
                                    <p className="text-sm text-gray-700">❓ {item.q}</p>
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );

        function EnhancedDiaryComponent({ t }) {
            const [mood, setMood] = useState('');

            const [notes, setNotes] = useState('');

                sleep: false, exercise: false, nutrition: false, water: false, meditation: false
            });
            const [entries, setEntries] = useState(() => {
                const saved = localStorage.getItem('diaryEntries');
                return saved ? JSON.parse(saved) : [];
            });

            const moodEmojis = { happy: '😊', okay: '😐', sad: '😢', excited: '🤩', anxious: '😰' };

            const saveEntry = () => {
                if (mood) {
                    const entry = {
                        id: Date.now(),
                        date: new Date().toLocaleDateString(),
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        mood,
                        energy,
                        symptoms,
                        notes,
                        habits: Object.keys(habits).filter(h => habits[h]),
                        completed: Object.keys(habits).filter(h => habits[h]).length
                    };
                    const updated = [entry, ...entries];
                    setEntries(updated);
                    localStorage.setItem('diaryEntries', JSON.stringify(updated));
                    setMood('');
                    setEnergy(3);
                    setSymptoms('');
                    setNotes('');
                    setHabits({ sleep: false, exercise: false, nutrition: false, water: false, meditation: false });
                }

            const avgMood = entries.length > 0 ? (
                (entries.reduce((sum, e) => sum + (e.mood === 'happy' ? 5 : e.mood === 'excited' ? 5 : e.mood === 'okay' ? 3 : e.mood === 'anxious' ? 2 : 1), 0) / entries.length * 20).toFixed(0)

                        {/* Mood Selector */}

                            <label className="block text-sm font-semibold text-gray-700 mb-3">{t.diary.mood}</label>
                            <div className="flex gap-2">
                                {Object.keys(moodEmojis).map(m => (
                                    <button
                                        key={m}
                                        onClick={() => setMood(m)}
                                        className={`flex-1 py-3 rounded-lg transition text-2xl ${
                                            mood === m ? 'bg-pink-500 text-white ring-2 ring-pink-700' : 'bg-gray-100 hover:bg-gray-200'

                                        {moodEmojis[m]}
                                    </button>

                            </div>
                        </div>

                        {/* Energy Level */}
                        <div className="mb-4">
                            <label className="block text-sm font-semibold text-gray-700 mb-2">{t.diary.energyLevel}: {energy}/5</label>

                                type="range"
                                min="1"
                                max="5"

                                onChange={(e) => setEnergy(parseInt(e.target.value))}

                        {/* Symptoms */}
                        <div className="mb-4">
                            <label className="block text-sm font-semibold text-gray-700 mb-2">{t.diary.symptoms}</label>

                        {/* Habits Checklist */}
                        <div className="mb-4">

                                            checked={habits[habit]}

                                        />

                                        <div className="flex justify-between items-start mb-2">
                                            <div>
                                                <p className="font-semibold text-gray-800">{entry.date} {entry.time}</p>
                                                <p className="text-lg">{moodEmojis[entry.mood]}</p>
                                            </div>
                                            <span className="text-sm bg-pink-200 text-pink-800 px-2 py-1 rounded">Energy: {entry.energy}/5</span>
                                        </div>
                                        {entry.symptoms && <p className="text-sm text-gray-600 mb-1">Symptoms: {entry.symptoms}</p>}
                                        {entry.notes && <p className="text-sm text-gray-600 mb-1">Notes: {entry.notes}</p>}
                                        {entry.habits.length > 0 && (
                                            <p className="text-xs text-gray-500">✓ {entry.habits.join(', ')}</p>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

            const [password, setPassword] = useState('');
            const [age, setAge] = useState('');
            const [country, setCountry] = useState('');

            const [isTeenMother, setIsTeenMother] = useState(false);

            const handleRegister = () => {
                const ageNum = parseInt(age);
                if (ageNum < 18) {
                    alert(t.auth.legal_age_error);
                    return;
                }
                
                const users = JSON.parse(localStorage.getItem('users') || '{}');
                if (users[username]) {
                    alert('Username already exists!');
                    return;
                }
                
                const isTeen = ageNum < 20;
                const profile = {
                    username, password, age: ageNum, country, userRole, pregnancyStatus, 
                    lmp, isFirstTime: isFirstTime === 'yes', isTeenMother: isTeen, isAdmin: username === 'admin'
                };
                
                users[username] = profile;
                localStorage.setItem('users', JSON.stringify(users));
                localStorage.setItem('currentUser', JSON.stringify(profile));
                
                onLoginSuccess(profile);
            };

            const handleLogin = () => {
                const users = JSON.parse(localStorage.getItem('users') || '{}');
                if (users[username] && users[username].password === password) {
                    localStorage.setItem('currentUser', JSON.stringify(users[username]));
                    onLoginSuccess(users[username]);
                } else {
                    alert('Invalid credentials');
                }
            };

            return (
                <div className="max-w-2xl mx-auto">
                    {step === 'choice' && (
                        <div className="bg-white rounded-lg p-8 shadow-lg text-center">

                                    {t.auth.register}

                                    onClick={() => setStep('login')}
                                    className="w-full bg-purple-500 text-white py-4 rounded-lg font-semibold hover:bg-purple-600 transition"
                                >
                                    {t.auth.login}

                                    <button

                                    >
                                        {t.auth.login}

                                >
                                    {t.common.cancel}
                                </button>
                            </div>
                        </div>
                    )}

                    {step === 'lmp-input' && (
                        <div className="bg-white rounded-lg p-8 shadow-lg">
                            <h2 className="text-2xl font-bold text-gray-900 mb-6">{t.auth.lmp}</h2>
                            <div className="space-y-4">
                                <input
                                    type="date"
                                    value={lmp}
                                    onChange={(e) => setLmp(e.target.value)}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-pink-500"
                                />
                                <button
                                    onClick={() => setStep('firstTime')}
                                    className="w-full bg-pink-500 text-white py-3 rounded-lg font-semibold hover:bg-pink-600 transition"
                                >
                                    {t.common.next}
                                </button>
                            </div>
                        </div>
                    )}

                    {step === 'firstTime' && (
                        <div className="bg-white rounded-lg p-8 shadow-lg">
                            <h2 className="text-2xl font-bold text-gray-900 mb-6">{t.auth.firstTime}</h2>
                            <div className="space-y-4">
                                <button
                                    onClick={() => { setIsFirstTime('yes'); setStep('intro'); }}
                                    className="w-full bg-green-100 border-2 border-green-500 text-green-700 py-3 rounded-lg font-semibold hover:bg-green-200 transition"
                                >
                                    {t.auth.yes}
                                </button>
                                <button
                                    onClick={() => { setIsFirstTime('no'); setStep('intro'); }}
                                    className="w-full bg-orange-100 border-2 border-orange-500 text-orange-700 py-3 rounded-lg font-semibold hover:bg-orange-200 transition"
                                >
                                    {t.auth.no}
                                </button>
                            </div>
                        </div>
                    )}

                    {step === 'intro' && (
                        <div className="bg-gradient-to-br from-pink-100 to-purple-100 rounded-lg p-8 shadow-lg text-center border-2 border-pink-300 fade-in">
                            <div className="text-6xl mb-4">🎉</div>
                            <h2 className="text-3xl font-bold text-gray-900 mb-4">Welcome to Her Greatness!</h2>
                            <p className="text-lg text-gray-700 mb-6">
                                {isFirstTime === 'yes' 
                                    ? "We're excited to support you on your first motherhood journey. You're stronger than you think! 💪"
                                    : "Welcome back! We're here to support you every step of the way. 💖"}
                            </p>
                            <p className="text-gray-600 mb-8">
                                This app is your safe space to track your pregnancy, mood, habits, and connect with other mothers. Everything is private, secure, and designed with you in mind.
                            </p>
                            <button
                                onClick={() => handleRegister()}
                                className="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white py-4 rounded-lg font-semibold hover:shadow-lg transition text-lg"
                            >
                                Start Your Journey
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        // ============ OTHER COMPONENTS (Placeholder) ============
        function HomePageComponent({ t, userProfile, onNavigate }) {
            return (
                <div className="text-center py-12 fade-in">
                    <h2 className="text-5xl font-bold text-gray-900 mb-4">{t.hero.title}</h2>
                    <p className="text-xl text-gray-600 mb-8 max-w-2xl mx-auto">{t.hero.description}</p>
                    <div className="grid md:grid-cols-3 gap-6 mb-8">
                        <div className="bg-white rounded-lg p-6 shadow-md border border-pink-100">
                            <div className="text-4xl mb-3">📅</div>
                            <h3 className="font-semibold text-gray-800">Calendar & Tracking</h3>
                            <p className="text-sm text-gray-600 mt-2">Monitor your pregnancy milestones</p>
                        </div>
                        <div className="bg-white rounded-lg p-6 shadow-md border border-purple-100">
                            <div className="text-4xl mb-3">📔</div>
                            <h3 className="font-semibold text-gray-800">Mood Diary</h3>
                            <p className="text-sm text-gray-600 mt-2">Track feelings and build healthy habits</p>
                        </div>
                        <div className="bg-white rounded-lg p-6 shadow-md border border-blue-100">
                            <div className="text-4xl mb-3">👥</div>
                            <h3 className="font-semibold text-gray-800">Community</h3>
                            <p className="text-sm text-gray-600 mt-2">Connect with other mothers</p>
                        </div>
                    </div>
                </div>
            );
        }

        function CalendarComponent({ t, userProfile }) {
            const [pregnancyDate, setPregnancyDate] = useState(userProfile?.lmp || '');
            const [week, setWeek] = useState(0);

            useEffect(() => {
                if (pregnancyDate) {
                    const lmpDate = new Date(pregnancyDate);
                    const today = new Date();
                    const diff = Math.floor((today - lmpDate) / (1000 * 60 * 60 * 24 * 7));
                    setWeek(Math.max(1, Math.min(42, diff)));
                }
            }, [pregnancyDate]);

            return (
                <div className="bg-white rounded-lg p-8 shadow-md">
                    <h2 className="text-3xl font-bold text-gray-900 mb-6">{t.calendar.title}</h2>
                    <input type="date" value={pregnancyDate} onChange={(e) => setPregnancyDate(e.target.value)} className="w-full md:w-80 px-4 py-2 border border-gray-300 rounded-lg mb-6" />
                    {week > 0 && (
                        <div className="bg-gradient-to-r from-pink-100 to-purple-100 rounded-lg p-6 border border-pink-200">
                            <p className="text-lg text-gray-800"><span className="font-bold text-pink-600">Week {week}</span> of pregnancy</p>
                        </div>
                    )}
                </div>
            );
        }

        function GrowthComponent({ t, userProfile }) {
            const [month, setMonth] = useState(5);

            return (
                <div className="space-y-8">
                    <div className="text-center">
                        <h2 className="text-3xl font-bold text-gray-900 mb-2">{t.growth.title}</h2>
                    </div>
                    <div className="grid md:grid-cols-2 gap-8">
                        <div className="bg-gradient-to-br from-pink-50 to-purple-50 rounded-lg p-8 shadow-md">
                            <BabyFruitIllustration month={month} />
                        </div>
                        <div className="space-y-4">
                            <div className="bg-white rounded-lg p-6 shadow-md">
                                <label className="block text-sm font-semibold mb-4">Select Month</label>
                                <div className="grid grid-cols-3 gap-2">
                                    {babyMonths.map(data => (
                                        <button
                                            key={data.month}
                                            onClick={() => setMonth(data.month)}
                                            className={`p-2 rounded transition font-semibold ${month === data.month ? 'bg-pink-600 text-white' : 'bg-gray-100 hover:bg-gray-200'}`}
                                        >
                                            M{data.month}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            <div className="bg-white rounded-lg p-6 shadow-md">
                                <p className="text-4xl mb-3">{babyMonths[month - 1].emoji}</p>
                                <p className="text-2xl font-bold text-pink-600">{babyMonths[month - 1].fruit}</p>
                                <div className="mt-4 pt-4 border-t border-gray-200">
                                    <p className="text-sm text-gray-600">Length: <span className="font-semibold">{babyMonths[month - 1].length}</span></p>
                                    <p className="text-sm text-gray-600">Weight: <span className="font-semibold">{babyMonths[month - 1].weight}</span></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function CommunityComponent({ t, userProfile }) {
            const [posts, setPosts] = useState(() => {
                const saved = localStorage.getItem('communityPosts');
                return saved ? JSON.parse(saved) : [];
            });
            const [title, setTitle] = useState('');
            const [content, setContent] = useState('');

            const createPost = () => {
                if (title && content) {
                    const post = {
                        id: Date.now(),
                        title, content,
                        author: 'Anonymous',
                        date: new Date().toLocaleDateString(),
                        likes: 0, liked: false
                    };
                    const updated = [post, ...posts];
                    setPosts(updated);
                    localStorage.setItem('communityPosts', JSON.stringify(updated));
                    setTitle('');
                    setContent('');
                }
            };

            return (
                <div className="bg-white rounded-lg p-8 shadow-md">
                    <h2 className="text-3xl font-bold text-gray-900 mb-6">{t.community.title}</h2>
                    <div className="mb-6 space-y-3">
                        <input type="text" placeholder="Post title..." value={title} onChange={(e) => setTitle(e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg" />
                        <textarea placeholder="Share your thoughts..." value={content} onChange={(e) => setContent(e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg h-24" />
                        <button onClick={createPost} className="w-full bg-pink-500 text-white py-2 rounded-lg font-semibold hover:bg-pink-600 transition">{t.community.createPost}</button>
                    </div>
                    <div className="space-y-4">
                        {posts.map(post => (
                            <div key={post.id} className="p-4 bg-gray-50 rounded-lg border border-gray-200">
                                <p className="font-semibold text-gray-800">{post.title}</p>
                                <p className="text-gray-700 text-sm mt-1">{post.content}</p>
                                <p className="text-xs text-gray-500 mt-2">{post.author} • {post.date}</p>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function BlogComponent({ t, userProfile }) {
            const [blogs, setBlogs] = useState(() => {
                const saved = localStorage.getItem('blogs');
                return saved ? JSON.parse(saved) : [
                    { id: 1, category: 'forFirstTime', title: 'First Trimester Tips', content: 'The first trimester can feel overwhelming. Here are some tips...' },
                    { id: 2, category: 'general', title: 'Nutrition During Pregnancy', content: 'Eating well is crucial for your baby\'s development...' }
                ];
            });

            return (
                <div className="bg-white rounded-lg p-8 shadow-md">
                    <h2 className="text-3xl font-bold text-gray-900 mb-6">{t.blog.title}</h2>
                    <div className="grid gap-6">
                        {blogs.map(blog => (
                            <div key={blog.id} className="p-6 bg-gradient-to-r from-pink-50 to-purple-50 rounded-lg border border-pink-200">
                                <span className="text-xs bg-pink-200 text-pink-800 px-2 py-1 rounded">{t.blog[blog.category]}</span>
                                <h3 className="text-lg font-semibold text-gray-800 mt-2">{blog.title}</h3>
                                <p className="text-gray-700 mt-2 text-sm">{blog.content}</p>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function AdminPanelComponent({ t }) {
            return (
                <div className="bg-white rounded-lg p-8 shadow-md">
                    <h2 className="text-3xl font-bold text-gray-900 mb-6">{t.blog.admin}</h2>
                    <p className="text-gray-600">Admin panel for managing blog content coming soon...</p>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
